apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-platform-production
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://github.com/zmanjith/ai-platform-gitops.git
      targetRevision: main
      path: charts/ai-platform
      helm:
        valueFiles:
          - $values/environments/production.yaml

    - repoURL: https://github.com/zmanjith/ai-platform-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-platform-production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

