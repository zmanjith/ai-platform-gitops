apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: ai-platform
spec:
  type: {{ .Values.service.type }}
  selector:
    app: ai-platform
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP